[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchthat"
version = "0.1.0"
description = "Private local-first Snapchat chat archives with an offline viewer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
catchthat = "catchthat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"viewer" = ["viewer/template.html"]

