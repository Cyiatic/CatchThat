name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: python -m pip install --editable ".[secure]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check capture adapter syntax
        run: node --check tools/snapchat_visible_capture.js
      - name: Build and verify synthetic viewer
        shell: bash
        run: |
          python -m catchthat build fixtures/sample/archive.json --output "$RUNNER_TEMP/catchthat-view"
          python -m catchthat verify "$RUNNER_TEMP/catchthat-view"
          node --check "$RUNNER_TEMP/catchthat-view/app.js"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/catchthat-wheel"
      - name: Validate public package boundary
        shell: bash
        run: |
          public_root="$RUNNER_TEMP/catchthat-public-source"
          mkdir -p "$public_root"
          # Keep the CI source snapshot aligned with the public release package.
          # These paths are intentionally local-only and may contain user data or
          # generated artifacts in a working checkout.
          git archive --format=tar HEAD -- . \
            ':(exclude)private-data' \
            ':(exclude)output' | tar -x -C "$public_root"
          python "$public_root/scripts/validate_public_package.py" --root "$public_root"
