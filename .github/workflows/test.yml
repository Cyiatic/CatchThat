name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: python -m pip install --editable .
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check capture adapter syntax
        run: node --check tools/snapchat_visible_capture.js
      - name: Build and verify synthetic viewer
        shell: bash
        run: |
          python -m catchthat build fixtures/sample/archive.json --output "$RUNNER_TEMP/catchthat-view"
          python -m catchthat verify "$RUNNER_TEMP/catchthat-view"
